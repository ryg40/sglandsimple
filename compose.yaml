services:
  mongo:
    image: mongo:7
    container_name: sglandsimple-mongo
    restart: unless-stopped
    volumes:
      # Persist Mongo data on the host so it survives `docker compose down`
      # and `--build` (a host bind mount is never touched by `down -v` or
      # `volume prune`). `./perm` is gitignored. Mongo stores under /data/db.
      - ./perm/db:/data/db
      - ./mongo-seed:/docker-entrypoint-initdb.d:ro
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-enterprise}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpw}
    networks:
      - default
    healthcheck:
      test:
        - "CMD"
        - "mongosh"
        - "--quiet"
        - "-u"
        - "${MONGO_ROOT_USER:-root}"
        - "-p"
        - "${MONGO_ROOT_PASSWORD:-rootpw}"
        - "--authenticationDatabase"
        - "admin"
        - "--eval"
        - "db.runCommand({ ping: 1 }).ok"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  mcp:
    build: ./mcp
    container_name: sglandsimple-mcp
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:?UPSTREAM_BASE_URL is required (set in .env.local)}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-dummy}
      UPSTREAM_MODEL: ${UPSTREAM_MODEL:?UPSTREAM_MODEL is required (set in .env.local)}
      SEARXNG_URL: ${SEARXNG_URL:?SEARXNG_URL is required (set in .env.local)}
      MONGO_URL: ${MONGO_URL:-mongodb://app:app@mongo:27017}
      MONGO_DB: ${MONGO_DB:-enterprise}
      ASK_DATA_MAX_DOCS: ${ASK_DATA_MAX_DOCS:-4}
      ASK_DATA_DEADLINE_SECONDS: ${ASK_DATA_DEADLINE_SECONDS:-240}
      ASK_DATA_BATCH_NOTES: ${ASK_DATA_BATCH_NOTES:-true}
      ASK_DATA_LIMIT_CEILING: ${ASK_DATA_LIMIT_CEILING:-50}
      LANGGRAPH_CHECKPOINT_COLLECTION: ${LANGGRAPH_CHECKPOINT_COLLECTION:-lg_checkpoints}
      # Stage 16 — HIL-gated Jira bulk edits. Apply only mutates the live Jira
      # API when JIRA_WRITES_ENABLED=true; otherwise it returns a dry-run plan.
      JIRA_WRITES_ENABLED: ${JIRA_WRITES_ENABLED:-false}
      JIRA_STAGE_MAX_EDITS: ${JIRA_STAGE_MAX_EDITS:-100}
      # Stage 11 — compliance command-center attention tunables.
      OVERVIEW_DUE_SOON_DAYS: ${OVERVIEW_DUE_SOON_DAYS:-14}
      OVERVIEW_STALE_DAYS: ${OVERVIEW_STALE_DAYS:-7}
      OVERVIEW_ATTENTION_LIMIT: ${OVERVIEW_ATTENTION_LIMIT:-10}
      OVERVIEW_TABLE_ROWS: ${OVERVIEW_TABLE_ROWS:-5}
    volumes:
      # Stage 4: filesystem sandbox for deep-agent file & shell tools.
      # Created on the host (`./sandbox/`); owned by uid 1000 inside the
      # container so the `sandbox` user can write to it.
      - ./sandbox:/sandbox
    # LAN-only; not behind the public hostname. Stage 3 hardens MCP before
    # exposing it publicly.
    ports:
      - "${MCP_PORT:-5451}:8080"
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Stage 21 — optional Deep Agent sandbox runtime (off by default).
  #
  # An isolated, non-root container for running agent shell/code/filesystem
  # work away from the MCP request path and Mongo credentials. Only starts
  # when the `sandbox` compose profile is selected
  # (`docker compose --profile sandbox up -d`) — a plain `docker compose up`
  # leaves it stopped, so existing behavior is unchanged. It shares the same
  # `./sandbox` bind mount (uid 1000) as `mcp`, so files written here are
  # visible to the in-mcp deep-agent and vice versa. Until the Stage-21
  # sidecar runtime lands (S21.deploy.1) it idles; use it via
  # `docker compose exec sandbox bash`.
  sandbox:
    build: ./sandbox-runtime
    container_name: sglandsimple-sandbox
    restart: unless-stopped
    profiles:
      - sandbox
    env_file:
      - .env.local
    environment:
      DEEP_AGENT_RUNTIME_MODE: ${DEEP_AGENT_RUNTIME_MODE:-in_mcp}
      DEEP_AGENT_ARTIFACT_DIR: ${DEEP_AGENT_ARTIFACT_DIR:-/sandbox/agent-artifacts}
      DEEP_AGENT_DRY_RUN_ONLY: ${DEEP_AGENT_DRY_RUN_ONLY:-true}
    volumes:
      - ./sandbox:/sandbox
    # LAN-only, default network only — deliberately NOT on `proxy`. The sandbox
    # runtime is never publicly reachable.
    networks:
      - default

  agent:
    build: ./agent
    container_name: sglandsimple-agent
    restart: unless-stopped
    depends_on:
      mcp:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:?UPSTREAM_BASE_URL is required (set in .env.local)}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-dummy}
      UPSTREAM_MODEL: ${UPSTREAM_MODEL:?UPSTREAM_MODEL is required (set in .env.local)}
      MCP_URL: http://mcp:8080/mcp
    ports:
      - "${AGENT_PORT:-5450}:8000"
    networks:
      - default
      - proxy
    # caddy-docker-proxy labels. Ignored by static-Caddyfile setups.
    # PUBLIC_HOSTNAME is required and must be set in .env.local.
    labels:
      caddy: ${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME is required (set in .env.local)}
      caddy.reverse_proxy: "{{upstreams 8000}}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./web
      args:
        WEB_BUILD_MODE: ${WEB_BUILD_MODE:-production}
    container_name: sglandsimple-web
    restart: unless-stopped
    depends_on:
      agent:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      AGENT_URL: http://agent:8000
      MCP_URL: http://mcp:8080/mcp
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      DEFAULT_MODEL: ${UPSTREAM_MODEL:?UPSTREAM_MODEL is required (set in .env.local)}
      AUDIT_RECENT_LIMIT: ${AUDIT_RECENT_LIMIT:-25}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-300}
      # Stage 19 — Web auth / RBAC
      AUTH_MODE: ${AUTH_MODE:-basic}
      AUTH_ALL_USERS_GROUP: ${AUTH_ALL_USERS_GROUP:-sg_all_users}
      AUTH_ADMIN_GROUP: ${AUTH_ADMIN_GROUP:-sg_sec_admin}
      AUTH_APP_USER_GROUP: ${AUTH_APP_USER_GROUP:-sg_app_user}
      AUTH_AUDIT_USER_GROUP: ${AUTH_AUDIT_USER_GROUP:-sg_audit_users}
      AUTH_TRUSTED_HEADER_USER: ${AUTH_TRUSTED_HEADER_USER:-X-Forwarded-User}
      AUTH_TRUSTED_HEADER_GROUPS: ${AUTH_TRUSTED_HEADER_GROUPS:-X-Forwarded-Groups}
      AUTH_SSO_REQUIRED: ${AUTH_SSO_REQUIRED:-false}
      AUTH_BASIC_USERS_FILE: ${AUTH_BASIC_USERS_FILE:-/data/auth/users.json}
      AUTH_BASIC_SEED_PASSWORD: ${AUTH_BASIC_SEED_PASSWORD:-}
      AUTH_DEV_HEADERS_ENABLED: ${AUTH_DEV_HEADERS_ENABLED:-false}
      AUTH_LDAP_URL: ${AUTH_LDAP_URL:-}
      AUTH_LDAP_BASE_DN: ${AUTH_LDAP_BASE_DN:-}
      AUTH_LDAP_BIND_SECRET_FILE: ${AUTH_LDAP_BIND_SECRET_FILE:-}
      AUTH_CACHE_TTL_SECONDS: ${AUTH_CACHE_TTL_SECONDS:-300}
    volumes:
      # Stage 19: Basic Auth users file. Host bind mount so the file
      # persists across container rebuilds and is never baked into the image.
      # Generate with: AUTH_BASIC_SEED_PASSWORD=<secret> python3 web/auth_seed.py
      # perm/ is gitignored — the file is never committed.
      - ./perm/auth:/data/auth
    ports:
      - "${WEB_PORT:-5452}:3000"
    networks:
      - default  # proxy removed: shared with other stacks; vibevoicemcp-mcp-1 also listens on :8080 causing DNS collisions for "mcp"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3000/healthz',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  proxy:
    external: true
