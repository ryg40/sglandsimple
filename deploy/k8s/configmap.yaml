# Non-secret runtime config. The agent profiles.yaml is delivered separately as
# its own ConfigMap (generate it from mcp/deep_agent/profiles.yaml):
#   kubectl create configmap sgland-profiles -n sgland \
#     --from-file=profiles.yaml=../../mcp/deep_agent/profiles.yaml -o yaml --dry-run=client | kubectl apply -f -
apiVersion: v1
kind: ConfigMap
metadata:
  name: sgland-config
  namespace: sgland
data:
  # Upstream endpoint/model (key is in the Secret). Point at the in-cluster or
  # external LLM service.
  UPSTREAM_BASE_URL: "http://llm-upstream:8000/v1"
  UPSTREAM_MODEL: "qwen3.6-27b"
  # Deep Agent platform — Stage 21.
  DEEP_AGENT_RUNTIME_MODE: "in_mcp"     # in_mcp | sidecar | remote
  DEEP_AGENT_PROFILES_FILE: "/app/deep_agent/profiles.yaml"
  DEEP_AGENT_ARTIFACT_DIR: "/sandbox/agent-artifacts"
  DEEP_AGENT_RUN_COLLECTION: "deep_agent_runs"
  DEEP_AGENT_AUDIT_COLLECTION: "deep_agent_audit"
  LANGGRAPH_CHECKPOINT_COLLECTION: "lg_checkpoints"
  # POC guardrail: never apply live external writes. Flip per environment.
  DEEP_AGENT_DRY_RUN_ONLY: "true"
  JIRA_WRITES_ENABLED: "false"
  # Bedrock (optional) — uncomment to route the builder role at Bedrock. Auth is
  # the IAM role on the mcp ServiceAccount, NOT a key.
  # BUILDER_PROVIDER: "bedrock"
  # BUILDER_BEDROCK_MODEL: "anthropic.claude-3-5-sonnet-20241022-v2:0"
  # BUILDER_BEDROCK_REGION: "us-east-1"
