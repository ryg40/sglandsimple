# TEMPLATE — copy to secret.yaml (gitignored), fill, then `kubectl apply`.
# Never commit a filled copy. For Bedrock there is NO key here — use IRSA /
# Workload Identity on the mcp ServiceAccount instead (see mcp-deployment.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: sgland-secrets
  namespace: sgland
type: Opaque
stringData:
  # Upstream OpenAI-compatible LLM (SGLang/vLLM/gateway). Bedrock roles ignore this.
  UPSTREAM_API_KEY: "REPLACE_ME"
  # Mongo credentials (checkpoint + run + audit store).
  MONGO_ROOT_USER: "root"
  MONGO_ROOT_PASSWORD: "REPLACE_ME"
  MONGO_URL: "mongodb://root:REPLACE_ME@mongo:27017/?authSource=admin"
  # Web auth signing secret (Stage 19 RBAC).
  AUTH_SECRET: "REPLACE_ME"
