<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sglandsimple</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/highlight.min.js"></script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <h1>sglandsimple</h1>
    <p class="muted">Chat or query the enterprise data — the agent dispatches to MCP tools.</p>
  </header>

  <main id="chat">
    <div id="history" aria-live="polite"></div>
  </main>

  <footer>
    <form id="composer">
      <textarea id="input" rows="3" placeholder="Ask something — e.g. open tickets per priority"></textarea>
      <div class="controls">
        <button type="submit" id="send" class="primary">Send</button>
        <button type="button" id="askdata">Ask data</button>
        <button type="button" id="clear">Clear</button>
        <span id="status" class="muted"></span>
      </div>
    </form>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
