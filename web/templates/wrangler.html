<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sglandsimple — wrangler</title>
  <link rel="stylesheet" href="/static/wrangler.css">
</head>
<body>
  <aside id="rail">
    <div class="rail-head">
      <a href="/" class="back">← Chat</a> · <a href="/sheet" class="back">Sheet</a>
      <h1>Tables</h1>
    </div>
    <nav id="collections" aria-label="collections"></nav>
    <div class="rail-foot muted">
      <small>Read-only. Each stage runs on its own.</small>
    </div>
  </aside>

  <main id="workspace">
    <header id="sample-bar">
      <div class="sample-left">
        <h2 id="title">…</h2>
        <span id="sample-note" class="muted"></span>
      </div>
      <div class="sample-right">
        <button id="refresh" type="button" title="Re-sample">⟳ Refresh</button>
        <button id="suggest" type="button" class="primary">✨ Ask agent for 3 starter queries</button>
      </div>
    </header>

    <section id="chips-wrap">
      <div id="chips" aria-label="field chips"></div>
      <div class="chips-hint muted">
        click = filter · ⌥/alt-click = project · right-click = group by
      </div>
    </section>

    <section id="builder">
      <div id="stages"></div>
      <div id="add-stage-row">
        <span class="muted">Add stage:</span>
        <button data-kind="match" type="button">+ Filter</button>
        <button data-kind="group" type="button">+ Group</button>
        <button data-kind="project" type="button">+ Project</button>
        <button data-kind="sort" type="button">+ Sort</button>
        <button data-kind="limit" type="button">+ Limit</button>
      </div>
    </section>

    <footer id="footer-bar">
      <button id="run-all" type="button">▶ Run all</button>
      <button id="save" type="button">💾 Save pipeline</button>
      <button id="load" type="button">📂 Load…</button>
      <span id="footer-note" class="muted"></span>
    </footer>
  </main>

  <div id="suggest-panel" hidden>
    <div class="panel-head">
      <strong>Suggested pipelines</strong>
      <button id="suggest-close" type="button">✕</button>
    </div>
    <div id="suggest-list"></div>
  </div>

  <div id="load-panel" hidden>
    <div class="panel-head">
      <strong>Saved pipelines</strong>
      <button id="load-close" type="button">✕</button>
    </div>
    <div id="load-list"></div>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <script src="/static/wrangler.js"></script>
</body>
</html>
